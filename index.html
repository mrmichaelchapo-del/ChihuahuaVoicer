<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<link rel="icon" href="/img/favicon.png">
<script>
    if (!sessionStorage.getItem("loadedOnce")) {
      sessionStorage.setItem("loadedOnce", "yes");
      window.location.href = "loading.html";
    }
  </script>
</head>
<body>

<video id="cam" autoplay playsinline></video>
<button id="start">Enable Camera</button>

<p>Put your dog up to the webcam</p>

<script>
  const video = document.getElementById("cam");
  const btn = document.getElementById("start");

  btn.onclick = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: true
      });
      video.srcObject = stream;
    } catch (err) {
      console.error("Camera error:", err);

      // Error handling moved INSIDE the catch where `err` exists
      if (err.name === "NotAllowedError") {
        alert("You blocked camera access 😭");
      }
      if (err.name === "NotFoundError") {
        alert("No camera detected, can't translate 💀");
      }
      if (err.name === "NotReadableError") {
        alert("Camera is already in use or another error 🔥");
      }
      if (err.name === "SecurityError") {
        alert("HTTPS required ⚠️");
      }
    }
  };

  // This alert must NOT reference err
  alert("We need the camera access to translate your barks to English.");
</script>

<a href="https://chihuahuavoicer.de/step2" class="btn">Next step 🚀</a>

<style>
  .btn {
    display: inline-block;
    padding: 12px 20px;
    background: #ffcc00;
    color: black;
    font-weight: bold;
    border-radius: 10px;
    text-decoration: none;
    font-size: 1.2rem;
    transition: 0.2s;
  }

  .btn:hover {
    background: #ffaa00;
    transform: scale(1.05);
  }
</style>
</body>
</html>

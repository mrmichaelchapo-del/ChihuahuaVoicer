<body>

<h1>STEP 4: Identifying dog type… 🐶🔍</h1>

<div id="resultBox" style="font-size:2rem;font-weight:bold;margin:20px;">
  Listening and analyzing… 🎧🐕
</div>

<script>
let audioContext;
let analyser;
let dataArray;

async function startDogTypeDetection() {
  audioContext = new AudioContext();

  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const source = audioContext.createMediaStreamSource(stream);

  analyser = audioContext.createAnalyser();
  analyser.fftSize = 256;

  dataArray = new Uint8Array(analyser.frequencyBinCount);
  source.connect(analyser);

  detectDogType();
}

function detectDogType() {
  analyser.getByteFrequencyData(dataArray);

  let volume = dataArray.reduce((a, b) => a + b) / dataArray.length;

  let dogType = "Unknown";

  // Simple classification based on bark volume
  if (volume < 40) {
    dogType = "Miniature Teacup Chihuahua 🍼🐕";
  } else if (volume < 65) {
    dogType = "Teacup Dog ☕🐶";
  } else if (volume < 85) {
    dogType = "Regular Chihuahua 🐕🔥";
  } else if (volume < 110) {
    dogType = "Dog 🐶💥";
  } else {
    dogType = "Old Dog 🧓🐕 (deep bark)";
  }

  document.getElementById("resultBox").textContent =
    "Detected: " + dogType;

  requestAnimationFrame(detectDogType);
}

startDogTypeDetection();
</script>
